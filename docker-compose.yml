services:
  db:
    image: postgres:18-alpine
    container_name: odin_market-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odin_market_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  pg_data:
